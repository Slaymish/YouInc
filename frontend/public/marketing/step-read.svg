<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <pattern id="sr-grid" patternUnits="userSpaceOnUse" width="32" height="32">
      <path d="M32 0 H0 V32" fill="none" stroke="#e3e3dd" stroke-width="1" />
    </pattern>
    <linearGradient id="sr-chart-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12a150" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#12a150" stop-opacity="0" />
    </linearGradient>
    <filter id="sr-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#28281e" flood-opacity="0.12" />
    </filter>
    <clipPath id="sr-frame-clip">
      <rect x="40" y="48" width="560" height="304" rx="16" />
    </clipPath>
  </defs>

  <rect width="640" height="400" fill="#f4f4f0" />
  <rect width="640" height="400" fill="url(#sr-grid)" opacity="0.55" />
  <text x="620" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="230" fill="#111111" opacity="0.05" text-anchor="end">3</text>

  <g filter="url(#sr-shadow)">
    <g clip-path="url(#sr-frame-clip)">
      <rect x="40" y="48" width="560" height="304" fill="#ffffff" />
      <rect x="40" y="48" width="560" height="32" fill="#f4f4f0" />
      <circle cx="60" cy="64" r="4.5" fill="#d3d3cc" />
      <circle cx="76" cy="64" r="4.5" fill="#d3d3cc" />
      <circle cx="92" cy="64" r="4.5" fill="#d3d3cc" />

      <!-- Stat tiles -->
      <rect x="60" y="94" width="164" height="76" rx="10" fill="#fbfbf9" stroke="#e3e3dd" />
      <rect x="238" y="94" width="164" height="76" rx="10" fill="#fbfbf9" stroke="#e3e3dd" />
      <rect x="416" y="94" width="164" height="76" rx="10" fill="#fbfbf9" stroke="#e3e3dd" />

      <text x="76" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#55534d">Net worth</text>
      <text x="76" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#111111">$142k</text>

      <text x="254" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#55534d">Runway</text>
      <text x="254" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#111111">18mo</text>

      <text x="432" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#55534d">Cashflow</text>
      <text x="432" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#0e8a44">+$3.7k</text>

      <!-- Mini trend chart -->
      <rect x="60" y="186" width="520" height="150" rx="10" fill="#fbfbf9" stroke="#e3e3dd" />
      <polygon points="80.0,295.8 151.4,282.4 222.9,289.1 294.3,269.0 365.7,254.4 437.1,262.2 508.6,235.4 580.0,213.0 580.0,316 80.0,316" fill="url(#sr-chart-fill)" />
      <polyline points="80.0,295.8 151.4,282.4 222.9,289.1 294.3,269.0 365.7,254.4 437.1,262.2 508.6,235.4 580.0,213.0" fill="none" stroke="#12a150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="580.0" cy="213.0" r="6" fill="#12a150" />
    </g>
    <rect x="40" y="48" width="560" height="304" rx="16" fill="none" stroke="#e3e3dd" />
  </g>

  <!-- Insight badge -->
  <circle cx="596" cy="66" r="27" fill="#e7f4ec" stroke="#bfe3cd" filter="url(#sr-shadow)" />
  <circle cx="590" cy="60" r="8.5" fill="none" stroke="#0e8a44" stroke-width="2.8" />
  <line x1="596" y1="66" x2="604" y2="74" stroke="#0e8a44" stroke-width="2.8" stroke-linecap="round" />
</svg>
