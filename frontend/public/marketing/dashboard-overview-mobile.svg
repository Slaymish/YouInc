  <circle cx="54" cy="908" r="4" fill="#1f6f8b" /><text x="64" y="912" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#55534d">Cash <tspan fill="#111111" font-weight="600">$28,500</tspan></text>
