<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <pattern id="ss-grid" patternUnits="userSpaceOnUse" width="32" height="32">
      <path d="M32 0 H0 V32" fill="none" stroke="#e3e3dd" stroke-width="1" />
    </pattern>
    <filter id="ss-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#28281e" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="640" height="400" fill="#f4f4f0" />
  <rect width="640" height="400" fill="url(#ss-grid)" opacity="0.55" />
  <text x="620" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="230" fill="#111111" opacity="0.05" text-anchor="end">2</text>

  <!-- Raw incoming transactions -->
  <g filter="url(#ss-shadow)">
    <rect x="32" y="90" width="200" height="220" rx="14" fill="#ffffff" stroke="#e3e3dd" />
  </g>
  <text x="52" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#55534d">Incoming</text>
  <g>
    <circle cx="60" cy="150" r="8" fill="#c7c7bd" />
    <rect x="80" y="145" width="140" height="8" rx="4" fill="#c7c7bd" />
    <rect x="80" y="159" width="90" height="6" rx="3" fill="#dedcd2" />

    <circle cx="60" cy="198" r="8" fill="#c7c7bd" />
    <rect x="80" y="193" width="150" height="8" rx="4" fill="#c7c7bd" />
    <rect x="80" y="207" width="70" height="6" rx="3" fill="#dedcd2" />

    <circle cx="60" cy="246" r="8" fill="#c7c7bd" />
    <rect x="80" y="241" width="130" height="8" rx="4" fill="#c7c7bd" />
    <rect x="80" y="255" width="100" height="6" rx="3" fill="#dedcd2" />
  </g>

  <!-- Connector into sync -->
  <line x1="232" y1="200" x2="270" y2="200" stroke="#12a150" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="270,192 286,200 270,208" fill="#12a150" />

  <!-- Sync loop -->
  <circle cx="330" cy="205" r="52" fill="none" stroke="#bfe3cd" stroke-width="1.5" stroke-dasharray="3 6" />
  <g fill="none" stroke="#12a150" stroke-width="5" stroke-linecap="round">
    <path d="M306 176 a32 32 0 0 1 48 8" />
    <path d="M354 234 a32 32 0 0 1 -48 -8" />
  </g>
  <polygon points="356,176 364,187 348,190" fill="#12a150" />
  <polygon points="304,234 296,223 312,220" fill="#12a150" />

  <!-- Connector into ledger -->
  <line x1="382" y1="205" x2="404" y2="205" stroke="#12a150" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="404,197 420,205 404,213" fill="#12a150" />

  <!-- Categorized ledger -->
  <g filter="url(#ss-shadow)">
    <rect x="408" y="80" width="200" height="240" rx="14" fill="#e7f4ec" stroke="#bfe3cd" />
  </g>
  <text x="428" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#0e8a44" font-weight="600">Categorized</text>

  <g>
    <circle cx="432" cy="142" r="8" fill="#1f6f8b" />
    <rect x="452" y="137" width="110" height="8" rx="4" fill="#0e8a44" opacity="0.5" />
    <circle cx="584" cy="141" r="13" fill="#0e8a44" />
    <path d="M578 141 l4 4 l8 -9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="432" cy="190" r="8" fill="#c98a2b" />
    <rect x="452" y="185" width="90" height="8" rx="4" fill="#0e8a44" opacity="0.5" />
    <circle cx="584" cy="189" r="13" fill="#0e8a44" />
    <path d="M578 189 l4 4 l8 -9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="432" cy="238" r="8" fill="#12a150" />
    <rect x="452" y="233" width="120" height="8" rx="4" fill="#0e8a44" opacity="0.5" />
    <circle cx="584" cy="237" r="13" fill="#0e8a44" />
    <path d="M578 237 l4 4 l8 -9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <rect x="250" y="340" width="140" height="36" rx="18" fill="#ffffff" stroke="#e3e3dd" filter="url(#ss-shadow)" />
  <text x="320" y="364" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#55534d" text-anchor="middle">live, all day</text>
</svg>
