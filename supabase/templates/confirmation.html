<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background:#f4f4f2; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8a82;">YouInc</p>
                <h1 style="margin:0 0 16px; font-size:20px; color:#1a1a16;">Confirm your email</h1>
                <p style="margin:0 0 24px; font-size:15px; line-height:1.5; color:#4a4a42;">
                  Enter this code on the sign-up screen to activate your account. It expires in 1 hour.
                </p>
                <p style="margin:0 0 24px; font-size:32px; font-weight:700; letter-spacing:0.3em; text-align:center; color:#1a1a16;">
                  {{ .Token }}
                </p>
                <p style="margin:0; font-size:13px; line-height:1.5; color:#8a8a82;">
                  Didn't try to sign up for YouInc? You can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
