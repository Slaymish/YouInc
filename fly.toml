# Fly.io app configuration for YouInc (stateless).
# See docs/deploy_fly.md for the full walkthrough.

app = 'youinc'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

  # VITE_SUPABASE_* are inlined at build time — they MUST be build-args, not
  # runtime secrets. Both are public-safe (anon key is RLS-gated). Set these to
  # your Supabase Cloud project's values before deploying (Part B, Task 11).
  [build.args]
    VITE_SUPABASE_URL = 'https://pntzvqetnovptiezirxt.supabase.co'
    VITE_SUPABASE_ANON_KEY = 'sb_publishable_MzJJuRrRLPXEvpi04S-ANA_O8JTOltG'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
