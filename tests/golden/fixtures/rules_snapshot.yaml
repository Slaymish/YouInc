defaults:
  currency: NZD
  suspense_account: Expenses:Uncategorized:Suspense

account_mappings:
  # Live Akahu/BNZ accounts for the You Inc. operating entity.
  acc_cmqp4p4gx00ev02k09dbja392:
    ledger_account: Assets:Bank:BNZ:Operating
    account_type: asset
  acc_cmqp4p4h500ex02k0btl0g6fs:
    ledger_account: Assets:Treasury:SlushFund
    account_type: asset
  # Sharesies accounts. Only Spend exposes a transaction feed via Akahu;
  # Growth/Emergencies/KiwiSaver are balance-only and tracked as manual
  # balance snapshots (see `set-balance`), not synced transactions.
  acc_cmoxiaqsd005n02juf9vi6sww:
    ledger_account: Assets:Investments:Sharesies:Spend
    account_type: asset
  acc_cmoxiaqse005p02ju9jww3sb0:
    ledger_account: Assets:Investments:Sharesies:Growth
    account_type: asset
  acc_cmoxiaqse005o02ju4a01hudz:
    ledger_account: Assets:Investments:Sharesies:Emergencies
    account_type: asset
  acc_cmoxiaqru005m02ju4x9a0srj:
    ledger_account: Assets:Investments:Sharesies:KiwiSaver
    account_type: asset
nzfcc_mappings:
  income:
    target_account: Income:Operating:EmploymentServices
  software:
    target_account: Expenses:OpEx:Software:Subscriptions
  utilities:
    target_account: Expenses:OpEx:Utilities
  transport:
    target_account: Expenses:OpEx:Transport
  groceries:
    target_account: Expenses:OpEx:MealsAndProvisions
  food:
    target_account: Expenses:OpEx:MealsAndProvisions
  health:
    target_account: Expenses:OpEx:FounderPerformance

rules:
  # Balance-sheet transfers and treasury allocation first.
  # BNZ Operating <-> SlushFund transfer, BNZ leg. SlushFund is a live,
  # independently-synced Akahu account (see account_mappings above), so both
  # legs post to a clearing account rather than SlushFund directly -- same
  # rationale as the BNZ <-> Sharesies Spend clearing pair below. Without
  # this, the SlushFund-side inbound leg falls through to
  # owner_capital_unknown_credit and double-counts the transfer as both a
  # SlushFund deposit and fabricated owner capital.
  - id: transfer_slush_fund_bnz_leg
    priority: 5
    match:
      description_regex: "(?i)slush fund"
      account_ids: [acc_cmqp4p4gx00ev02k09dbja392]
    route:
      target_account: Assets:Internal:TransferClearing
      memo: BNZ leg of a BNZ <-> SlushFund transfer

  # SlushFund-side leg of the same transfer.
  - id: transfer_slush_fund_slushfund_leg
    priority: 5
    match:
      account_ids: [acc_cmqp4p4h500ex02k0btl0g6fs]
    route:
      target_account: Assets:Internal:TransferClearing
      memo: SlushFund leg of a BNZ <-> SlushFund transfer (verify against TransferClearing balance)

  # Twisted Frequency is a Blossom account (not connected to Akahu), tracked
  # via manual balance snapshots (see `set-balance`). Unlike the Sharesies
  # transfers above, Blossom has no independent Akahu feed to double-post
  # from, so this stays a normal one-sided transfer rather than routing
  # through the clearing account.
  - id: transfer_twisted_frequency
    priority: 6
    match:
      description_regex: "(?i)twisted frequency"
    route:
      target_account: Assets:Investments:Blossom:TwistedFrequency
      memo: Transfer to Blossom Twisted Frequency pot (tracked via manual balance, not Akahu)

  - id: transfer_travel_reserve
    priority: 8
    match:
      description_regex: "(?i)euro trip"
    route:
      target_account: Assets:Treasury:TravelReserve
      memo: Treasury reserve allocation

  - id: transfer_certification_reserve
    priority: 9
    match:
      description_regex: "(?i)pg license|paraglider savings"
    route:
      target_account: Assets:Treasury:CertificationReserve
      memo: Capability/certification reserve allocation

  - id: investment_blossom
    priority: 10
    match:
      description_regex: "(?i)blossomapp|blossom"
    route:
      target_account: Assets:Investments:Blossom
      memo: Treasury investment allocation

  # BNZ <-> Sharesies Spend transfer, BNZ leg. The Sharesies-side leg of the
  # same transfer is matched separately below by transfer_bnz_sharesies_inbound.
  # Both legs post to a clearing account instead of Sharesies:Spend directly,
  # so the transfer isn't double-counted now that both accounts are synced
  # independently (BNZ posts an outflow, Sharesies posts an inflow — without
  # a shared clearing account the amount would land on the balance sheet twice
  # and Sharesies' "Deposit from BURKE H A" would be miscoded as new equity).
  - id: investment_sharesies
    priority: 11
    match:
      description_regex: "(?i)sharesies"
      account_ids:
        [acc_cmqp4p4gx00ev02k09dbja392, acc_cmqp4p4h500ex02k0btl0g6fs]
    route:
      target_account: Assets:Internal:TransferClearing
      memo: BNZ leg of a BNZ <-> Sharesies Spend transfer

  # Sharesies-side leg of the same BNZ <-> Sharesies Spend transfer. Akahu
  # renders the counterparty as the depositor's own name (e.g. "Deposit from
  # BURKE H A") or "Transfer from/to Wallet" rather than mentioning BNZ, so
  # match on the Sharesies Spend account instead of description text. This is
  # broader than ideal — it will also catch genuinely new external deposits
  # into Sharesies Spend, which is the safer failure mode (clearing account
  # needs a one-off manual look versus silently fabricating equity).
  - id: transfer_bnz_sharesies_inbound
    priority: 11
    match:
      description_regex: "(?i)deposit from|transfer from wallet|transfer to wallet"
      account_ids: [acc_cmoxiaqsd005n02juf9vi6sww]
    route:
      target_account: Assets:Internal:TransferClearing
      memo: Sharesies leg of a BNZ <-> Sharesies Spend transfer (verify against TransferClearing balance)

  - id: owner_drawings_cash
    priority: 12
    match:
      description_regex: "(?i)^withdrawal|atm"
    route:
      target_account: Equity:Owner:Drawings
      memo: Cash movement requiring board-level review

  # Revenue and owner/entity capital.
  - id: revenue_employment_services
    priority: 20
    match:
      amount_greater_than: 0
      description_regex: "(?i)alphero|salary|payroll|wages"
    route:
      target_account: Income:Operating:EmploymentServices
      memo: Operating income from employment/services

  - id: revenue_client_services
    priority: 21
    match:
      amount_greater_than: 0
      description_regex: "(?i)masters plyometrics|client|invoice"
    route:
      target_account: Income:Operating:ClientServices
      memo: Client/service revenue

  - id: contra_ai_software_reimbursement
    priority: 22
    match:
      amount_greater_than: 0
      description_regex: "(?i)chatgpt|openai|anthropic|utube|youtube"
    route:
      target_account: Expenses:OpEx:Software:AIAndTools
      memo: Reimbursement/contra expense for software subscription

  - id: contra_founder_performance_reversal
    priority: 23
