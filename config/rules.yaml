defaults:
  currency: NZD
  suspense_account: Expenses:Uncategorized:Suspense

account_mappings:
  # Live Akahu/BNZ accounts for the You Inc. operating entity.
  acc_cmqp4p4gx00ev02k09dbja392:
    ledger_account: Assets:Bank:BNZ:Operating
    account_type: asset
  acc_cmqp4p4h500ex02k0btl0g6fs:
    ledger_account: Assets:Treasury:SlushFund
    account_type: asset
  acc_cmqp4p4hc00ez02k0bh9h62iz:
    ledger_account: Assets:Bank:BNZ:TwistedFrequency
    account_type: asset
  acc_cmqp4p4hj00f102k0bwp05fss:
    ledger_account: Assets:Bank:BNZ:Paychase
    account_type: asset

nzfcc_mappings:
  income:
    target_account: Income:Operating:EmploymentServices
  software:
    target_account: Expenses:OpEx:Software:Subscriptions
  utilities:
    target_account: Expenses:OpEx:Utilities
  transport:
    target_account: Expenses:OpEx:Transport
  groceries:
    target_account: Expenses:OpEx:MealsAndProvisions
  food:
    target_account: Expenses:OpEx:MealsAndProvisions
  health:
    target_account: Expenses:OpEx:FounderPerformance

rules:
  # Balance-sheet transfers and treasury allocation first.
  - id: transfer_slush_fund
    priority: 5
    match:
      description_regex: "(?i)slush find"
    route:
      target_account: Assets:Treasury:SlushFund
      memo: Internal treasury reserve transfer

  - id: transfer_twisted_frequency
    priority: 6
    match:
      description_regex: "(?i)twisted frequency"
    route:
      target_account: Assets:Bank:BNZ:TwistedFrequency
      memo: Internal account transfer

  - id: transfer_paychase
    priority: 7
    match:
      description_regex: "(?i)paychase limited"
    route:
      target_account: Assets:Bank:BNZ:Paychase
      memo: Internal Paychase account transfer

  - id: transfer_travel_reserve
    priority: 8
    match:
      description_regex: "(?i)euro trip"
    route:
      target_account: Assets:Treasury:TravelReserve
      memo: Treasury reserve allocation

  - id: transfer_certification_reserve
    priority: 9
    match:
      description_regex: "(?i)pg license|paraglider savings"
    route:
      target_account: Assets:Treasury:CertificationReserve
      memo: Capability/certification reserve allocation

  - id: investment_blossom
    priority: 10
    match:
      description_regex: "(?i)blossomapp|blossom"
    route:
      target_account: Assets:Investments:Blossom
      memo: Treasury investment allocation

  - id: investment_sharesies
    priority: 11
    match:
      description_regex: "(?i)sharesies"
    route:
      target_account: Assets:Investments:Sharesies
      memo: Investment allocation

  - id: owner_drawings_cash
    priority: 12
    match:
      description_regex: "(?i)^withdrawal|atm"
    route:
      target_account: Equity:Owner:Drawings
      memo: Cash movement requiring board-level review

  # Revenue and owner/entity capital.
  - id: revenue_employment_services
    priority: 20
    match:
      amount_greater_than: 0
      description_regex: "(?i)alphero|salary|payroll|wages"
    route:
      target_account: Income:Operating:EmploymentServices
      memo: Operating income from employment/services

  - id: revenue_client_services
    priority: 21
    match:
      amount_greater_than: 0
      description_regex: "(?i)masters plyometrics|client|invoice"
    route:
      target_account: Income:Operating:ClientServices
      memo: Client/service revenue

  - id: contra_ai_software_reimbursement
    priority: 22
    match:
      amount_greater_than: 0
      description_regex: "(?i)chatgpt|openai|anthropic|utube|youtube"
    route:
      target_account: Expenses:OpEx:Software:AIAndTools
      memo: Reimbursement/contra expense for software subscription

  - id: contra_founder_performance_reversal
    priority: 23
    match:
      amount_greater_than: 0
      description_regex: "(?i)dishonour.*les mills|les mills.*dishonour"
    route:
      target_account: Expenses:OpEx:FounderPerformance
      memo: Reversal/contra expense

  - id: owner_capital_unknown_credit
    priority: 29
    match:
      amount_greater_than: 0
    route:
      target_account: Equity:Owner:Contributions
      memo: Unmatched credit treated as owner/entity capital until reviewed

  # Software, AI tooling, cloud, and communications.
  - id: ai_and_coding_tools
    priority: 40
    match:
      description_regex: "(?i)openai|anthropic|chatgpt|amp code|ampcode|nebula"
    route:
      target_account: Expenses:OpEx:Software:AIAndTools
      memo: AI/coding tools for You Inc. operating leverage

  - id: productivity_cloud
    priority: 41
    match:
      description_regex: "(?i)google workspace|google|icloud|apple|youtube|utube"
    route:
      target_account: Expenses:OpEx:Software:CloudServices
      memo: Cloud/productivity subscription

  - id: spark_saas
    priority: 42
    match:
      description_regex: "(?i)spark|spark nz"
      merchant_regex: "(?i)spark"
    route:
      target_account: Expenses:OpEx:Connectivity
      memo: Connectivity/telecommunications

  # Facilities and operating baseline.
  - id: facilities_rent
    priority: 50
    match:
      description_regex: "(?i)bills and rent|\brent\b"
    route:
      target_account: Expenses:OpEx:Facilities:Rent
      memo: Operating facility baseline

  - id: transport_public_and_micro
    priority: 60
    match:
      description_regex: "(?i)snapper|lime"
    route:
      target_account: Expenses:OpEx:Transport
      memo: Operating transport

  - id: founder_performance_health
    priority: 70
    match:
      description_regex: "(?i)les mills|bargain chemist|unichem|chemist"
    route:
      target_account: Expenses:OpEx:FounderPerformance
      memo: Founder health/performance capability

  - id: meals_and_provisions
    priority: 80
    match:
      description_regex: "(?i)woolworths|milkrun|7 mart|yr door mart|supreme store|subway|kfc|tj katsu|zambrero|shelly bay|brezelmania|top kitchen|samick|juice"
    route:
      target_account: Expenses:OpEx:MealsAndProvisions
      memo: Operating sustenance/provisions for You Inc.

  - id: capital_asset_large_purchase
    priority: 90
    match:
      amount_abs_greater_than: 1000.00
      description_regex: "(?i)pb tech|computer|laptop|equipment"
    route:
      target_account: Assets:Equipment:Computer
      memo: Capital equipment
