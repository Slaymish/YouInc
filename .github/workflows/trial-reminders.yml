# Daily trigger for the 14-day live-sync trial reminder job.
#
# Calls the app's secret-guarded endpoint once a day; the endpoint itself decides
# which tenants are inside the day-12 window (idempotent — safe to run daily and
# to re-run). Requires two repo secrets:
#   CRON_SECRET      — must equal the app's CRON_SECRET env var
#   CRON_TARGET_URL  — the app origin, e.g. https://youinc.hamishburke.dev
name: trial-reminders

on:
  schedule:
    # 19:00 UTC ≈ 07:00 NZST / 08:00 NZDT — a sensible daily send time.
    - cron: "0 19 * * *"
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trial-reminder run
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_TARGET_URL }}/api/cron/trial-reminders"
