name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # vite build + tsc --noEmit — catches type errors on every PR, same as
      # what runs inside the Docker image build.
      - run: pnpm build

      - run: pnpm test

  deploy:
    name: Deploy to Fly.io
    needs: [test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: youinc-ledger-deploy # serialize deploys even if CI re-triggers quickly
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Builds the Dockerfile on Fly's remote builder (no local Docker needed
      # in the runner) and rolls it out per fly.toml. --yes auto-confirms the
      # non-interactive prompt when an old machine still has the (now-removed)
      # volume attached; the app is stateless and ignores it.
      - run: flyctl deploy --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
